name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual trigger — also the way to run the restricted seed-run job
  # Nightly schedule intentionally disabled: this is a portfolio project with
  # no on-call to react to a nightly failure, and the restricted job hits the
  # live PokeAPI. Kept here to show the intent; enable in a real project to
  # detect drift of the external integration.
  # schedule:
  #   - cron: "0 3 * * *"

env:
  SUT_REPO: koshakowsky/pokeanalytics
  SUT_REF: main

jobs:
  # Static check, no SUT needed: every designed case must be executed by a test.
  traceability:
    name: Catalog ↔ automation traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/check_traceability.py --strict

  api-tests:
    name: Full suite (seed disabled, default dataset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout SUT
        uses: actions/checkout@v7
        with:
          repository: koshakowsky/pokeanalytics
          ref: main
          path: sut

      # Fixture seeding is synchronous at startup: --wait returning healthy
      # already implies "dataset ready" — a single assert replaces polling.
      - name: Start SUT stack (no token, hermetic fixture seed)
        working-directory: sut
        run: docker compose up -d --build --wait
        env:
          AUTO_SEED: "1"
          AUTO_SEED_SOURCE: "fixture"

      - name: Assert dataset is ready
        run: |
          total=$(curl -sf 'http://localhost/api/pokemon/?limit=1' | jq -r .total)
          [ "$total" = "151" ] || { echo "expected 151 pokemon, got: $total"; exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip   # --group needs pip >= 25.1

      - name: Install test dependencies
        run: pip install --group api

      - name: Run suite
        run: pytest api -n auto --alluredir=allure-results
        env:
          POKETESTS_BASE_URL: http://localhost/api

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-api-tests
          path: allure-results

      - name: SUT logs on failure
        if: failure()
        working-directory: sut
        run: docker compose logs --tail=200

  seed-auth-tests:
    name: Full suite (token configured)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout SUT
        uses: actions/checkout@v7
        with:
          repository: koshakowsky/pokeanalytics
          ref: main
          path: sut

      # The secret exists only for the lifetime of this job: generated here,
      # passed to the stack; the 401-branch tests never need its value.
      - name: Generate per-run seed token
        run: echo "SEED_TOKEN=$(uuidgen)" >> "$GITHUB_ENV"

      # Hermetic seeding made the full suite cheap in this config too, so we
      # run everything: the seed_disabled case skips itself via the probe.
      - name: Start SUT stack (token configured, hermetic fixture seed)
        working-directory: sut
        run: docker compose up -d --build --wait
        env:
          AUTO_SEED: "1"
          AUTO_SEED_SOURCE: "fixture"

      - name: Assert dataset is ready
        run: |
          total=$(curl -sf 'http://localhost/api/pokemon/?limit=1' | jq -r .total)
          [ "$total" = "151" ] || { echo "expected 151 pokemon, got: $total"; exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip   # --group needs pip >= 25.1

      - name: Install test dependencies
        run: pip install --group api

      - name: Run suite (401 branch of the seed decision table included)
        run: pytest api -n auto --alluredir=allure-results
        env:
          POKETESTS_BASE_URL: http://localhost/api

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-seed-auth
          path: allure-results

      - name: SUT logs on failure
        if: failure()
        working-directory: sut
        run: docker compose logs --tail=200

  seed-run:
    name: Restricted seed run (destructive, external network)
    # Destructive + hits the real PokeAPI: never on PRs, only nightly/manual.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout SUT
        uses: actions/checkout@v7
        with:
          repository: koshakowsky/pokeanalytics
          ref: main
          path: sut

      - name: Generate per-run seed token
        run: echo "SEED_TOKEN=$(uuidgen)" >> "$GITHUB_ENV"

      - name: Start SUT stack (token configured, empty DB)
        working-directory: sut
        run: docker compose up -d --build --wait
        env:
          AUTO_SEED: "0" # the test itself seeds max_pokemon=5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip   # --group needs pip >= 25.1

      - name: Install test dependencies
        run: pip install --group api

      - name: Run restricted seeding test (decision-table row 4)
        run: pytest api -m restricted --alluredir=allure-results
        env:
          POKETESTS_BASE_URL: http://localhost/api
          POKETESTS_SEED_TOKEN: ${{ env.SEED_TOKEN }}
          POKETESTS_SKIP_DATA_CANARY: "1"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-seed-run
          path: allure-results

      - name: SUT logs on failure
        if: failure()
        working-directory: sut
        run: docker compose logs --tail=200

  contract-tests:
    name: Contract (schemathesis vs live OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout SUT
        uses: actions/checkout@v7
        with:
          repository: koshakowsky/pokeanalytics
          ref: main
          path: sut

      - name: Start SUT stack (hermetic fixture seed)
        working-directory: sut
        run: docker compose up -d --build --wait
        env:
          AUTO_SEED: "1"
          AUTO_SEED_SOURCE: "fixture"

      - name: Assert dataset is ready
        run: |
          total=$(curl -sf 'http://localhost/api/pokemon/?limit=1' | jq -r .total)
          [ "$total" = "151" ] || { echo "expected 151 pokemon, got: $total"; exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip   # --group needs pip >= 25.1

      - name: Install contract dependencies
        run: pip install --group contract

      - name: Run contract suite (fuzz every operation from the live schema)
        run: pytest contract --alluredir=allure-results
        env:
          POKETESTS_BASE_URL: http://localhost/api

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-contract
          path: allure-results

      - name: SUT logs on failure
        if: failure()
        working-directory: sut
        run: docker compose logs --tail=200

  # Publishes a browsable Allure report to GitHub Pages. Merges results from all
  # three layers: the API suite (this workflow), the contract suite (this
  # workflow) and the E2E suite (from the latest ui-tests run). Only on pushes
  # to main, even if tests failed — a report is most useful when something is
  # red. Requires Pages source set to "GitHub Actions" in the repo settings.
  publish-report:
    name: Publish Allure report
    needs: [api-tests, contract-tests]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # The dashboard generator lives in this repo, so we need its code.
      - name: Checkout test repo
        uses: actions/checkout@v7

      - name: Download API suite results
        uses: actions/download-artifact@v8
        with:
          name: allure-results-api-tests
          path: allure-results

      # Contract results come from this same workflow run.
      - name: Download contract results
        uses: actions/download-artifact@v8
        with:
          name: allure-results-contract
          path: allure-results

      # E2E lives in a separate workflow (ui-tests), so its results have to be
      # pulled in. Prefer the run for THIS commit; if the browser matrix has not
      # finished yet, fall back to the newest successful one and say so.
      - name: Merge in E2E results (ui-tests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh run list --workflow=ui-tests.yml --branch=main --limit=20 \
                   --json databaseId,headSha,conclusion)

          rid=$(jq -r --arg sha "$GITHUB_SHA" \
                '[.[] | select(.headSha == $sha and .conclusion == "success")][0].databaseId // empty' <<<"$runs")
          scope="this commit"
          if [ -z "$rid" ]; then
            rid=$(jq -r '[.[] | select(.conclusion == "success")][0].databaseId // empty' <<<"$runs")
            scope="an earlier commit (ui-tests for this one had not finished)"
          fi

          if [ -z "$rid" ]; then
            echo "::warning::No successful ui-tests run found - publishing without the E2E layer."
            echo "- **E2E results:** none (no successful ui-tests run yet)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          before=$(ls allure-results/*-result.json 2>/dev/null | wc -l)
          if gh run download "$rid" -n allure-results-e2e-chromium -D allure-results; then
            after=$(ls allure-results/*-result.json 2>/dev/null | wc -l)
            echo "- **E2E results:** merged $((after - before)) from ui-tests run $rid ($scope)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not download the E2E artifact from run $rid (expired, or missing actions:read)."
            echo "- **E2E results:** download failed for run $rid" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Trends (pass/fail, duration over runs) require the previous report's
      # history/ folder fed back into the new results. We pull it from the
      # already-published Pages site — official actions only, no gh-pages
      # branch or third-party action. The first run 404s and starts empty.
      - name: Seed Allure history from the previous report
        run: |
          mkdir -p allure-results/history
          base="https://koshakowsky.github.io/poketests/allure/history"
          for f in history.json history-trend.json categories-trend.json \
                   duration-trend.json retry-trend.json; do
            curl -fsSL "$base/$f" -o "allure-results/history/$f" \
              || rm -f "allure-results/history/$f"
          done

      # Label each build in the trend with the CI run number and a link back.
      - name: Write Allure executor metadata
        run: |
          cat > allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "run #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://koshakowsky.github.io/poketests/allure/"
          }
          EOF

      # Build the combined site: health dashboard at the root, full Allure
      # report under /allure/.
      - name: Generate Allure HTML report
        run: npx --yes allure-commandline generate allure-results --clean -o site/allure

      - name: Build project-health dashboard
        run: python3 tools/build_dashboard.py allure-results site/index.html
        env:
          BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      # Which layers actually made it into the report. A missing E2E layer once
      # went unnoticed for several runs; this puts the answer on the run page.
      - name: Report layer breakdown
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections, glob, json
          counts = collections.Counter()
          for path in glob.glob("allure-results/*-result.json"):
              with open(path, encoding="utf-8") as fh:
                  labels = json.load(fh).get("labels", [])
              counts[next((l["value"] for l in labels if l["name"] == "parentSuite"), "unlabelled")] += 1
          print("| Layer | Tests |")
          print("|-------|-------|")
          for layer in ("API", "Contract", "E2E"):
              print(f"| {layer} | {counts.get(layer, 0)} |")
          if not counts.get("E2E"):
              print("\n> :warning: no E2E results in this report")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
