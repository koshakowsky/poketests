name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Decide whether the browser matrix needs to run. On push/manual it always
  # does; on a PR only when E2E-relevant paths changed.
  detect:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -qE \
             '^(e2e/|test-cases/e2e/|conftest\.py|dataset\.py|pytest\.ini|\.github/workflows/ui-tests\.yml)'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: detect
    if: needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            mark: "" # full suite (pytest.ini's `-m "not restricted"` applies)
          - browser: firefox
            mark: "-m p0" # smoke only
          - browser: webkit
            mark: "-m p0"
    steps:
      - name: Checkout test repo
        uses: actions/checkout@v7

      - name: Checkout SUT
        uses: actions/checkout@v7
        with:
          repository: koshakowsky/pokeanalytics
          ref: main
          path: sut

      - name: Start SUT stack (hermetic fixture seed)
        working-directory: sut
        run: docker compose up -d --build --wait
        env:
          AUTO_SEED: "1"
          AUTO_SEED_SOURCE: "fixture"

      - name: Assert dataset is ready
        run: |
          total=$(curl -sf 'http://localhost/api/pokemon/?limit=1' | jq -r .total)
          [ "$total" = "151" ] || { echo "expected 151 pokemon, got: $total"; exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install E2E dependencies
        run: pip install -r e2e/requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E (${{ matrix.browser }})
        run: pytest e2e --browser ${{ matrix.browser }} ${{ matrix.mark }} --alluredir=allure-results
        env:
          POKETESTS_WEB_URL: http://localhost
          POKETESTS_BASE_URL: http://localhost/api

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-e2e-${{ matrix.browser }}
          path: allure-results

      - name: SUT logs on failure
        if: failure()
        working-directory: sut
        run: docker compose logs --tail=200

  # Single aggregated status check — make THIS the required check in branch
  # protection. It passes when the matrix succeeded or was legitimately skipped
  # by the path filter, and fails when any browser leg failed.
  gate:
    if: always()
    needs: [detect, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify E2E outcome
        run: |
          echo "detect=${{ needs.detect.result }} e2e=${{ needs.e2e.result }}"
          if [ "${{ needs.detect.result }}" != "success" ]; then
            echo "detect job failed"; exit 1
          fi
          case "${{ needs.e2e.result }}" in
            success|skipped) echo "E2E gate OK" ;;
            *) echo "E2E matrix failed"; exit 1 ;;
          esac
