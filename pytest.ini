[pytest]
testpaths = tests
; --strict-markers: опечатка в имени маркера должна валить сбор тестов,
; а не молча создавать новый маркер (иначе `-m p0` тихо пропустит тест).
; -ra: в итоговой сводке показывать причины всех не-passed исходов —
; xfail/skip без причин в отчёте нечитаемы.
; -m "not restricted": деструктивные/сетевые тесты исключены по умолчанию —
; их запуск только осознанный (`pytest -m restricted`); -m с CLI
; переопределяет этот фильтр (последний -m выигрывает).
addopts = -ra --strict-markers -m "not restricted"
markers =
    p0: critical smoke — ломается → релиз стоп
    p1: high priority
    p2: medium priority
    p3: low priority / нефункциональные
    seed_disabled: требует стенд БЕЗ SEED_TOKEN; иначе тест скипается
    seed_enabled: требует стенд С SEED_TOKEN; иначе тест скипается
    restricted: деструктивные/внешне-сетевые тесты — только явный запуск на изолированном стенде
