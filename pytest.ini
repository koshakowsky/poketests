[pytest]
# Two peer suites: api/ and e2e/. Bare `pytest` runs the API suite (default);
# E2E is opt-in via `pytest e2e` (it needs browsers). pythonpath puts the repo
# root (dataset), the api suite (schemas) and the e2e suite (pages package) on
# sys.path so imports resolve from either suite.
testpaths = api/tests
pythonpath = . api e2e
addopts = -ra --strict-markers -m "not restricted"
markers =
    p0: critical smoke — if broken → stop release
    p1: high priority
    p2: medium priority
    p3: low priority / non-functional
    seed_disabled: stage without SEED_TOKEN
    seed_enabled: stage with SEED_TOKEN
    restricted: destructive/external network tests — explicit execution only, on an isolated stage
